<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Улучшенная CSP для Tor -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <title>{% block title %}PublicPaste{% endblock %}</title>
    <style>
        :root {
            /* Изменение цветовой гаммы на желтую */
            --main-color: #B8860B; /* DarkGoldenrod */
            --accent-color: #FFD700; /* Gold */
            --background-color: #FFFAF0; /* FloralWhite */
            --text-dark: #332200;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--background-color);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-dark);
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .navbar {
            background: var(--main-color) !important;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(184, 134, 11, 0.2);
            padding: 15px 20px;
            animation: slideDown 0.8s ease-out;
            display: flex;
            justify-content: space-between;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: white !important;
            text-decoration: none;
        }

        .navbar-nav {
            display: flex;
            gap: 15px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            transition: color 0.3s ease, transform 0.3s ease;
            text-decoration: none;
        }

        .nav-link:hover {
            color: white !important;
            transform: translateY(-2px);
        }

        .warning-banner {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(184, 134, 11, 0.1);
            animation: slideUp 0.8s ease-out;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(184, 134, 11, 0.1);
            margin-bottom: 20px;
            background: white;
            overflow: hidden;
            animation: fadeIn 1s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(184, 134, 11, 0.2);
        }

        .card-header {
            background: var(--main-color);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 15px 20px;
            font-weight: bold;
        }

        .card-body {
            padding: 20px;
        }

        .paste-content {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .list-group {
            list-style: none;
            padding: 0;
        }

        .list-group-item {
            border: none;
            margin-bottom: 10px;
            border-radius: 10px !important;
            box-shadow: 0 3px 10px rgba(184, 134, 11, 0.1);
            padding: 15px;
            background: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
            text-decoration: none;
            color: var(--text-dark);
        }

        .list-group-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(184, 134, 11, 0.2);
        }

        /* Кнопки */
        .btn {
            display: inline-block;
            font-weight: 500;
            text-align: center;
            vertical-align: middle;
            user-select: none;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin: 5px 0;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--main-color);
            color: white;
            padding: 10px 25px;
            border-radius: 10px;
        }

        .btn-primary:hover {
            background: var(--accent-color);
            color: var(--text-dark);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 5px 15px rgba(184, 134, 11, 0.3);
        }

        /* Формы */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-control, .form-select {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: 10px;
            border: 2px solid #f0e0b0;
            background-clip: padding-box;
            transition: all 0.3s ease;
            background-color: white;
            box-sizing: border-box;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(255, 215, 0, 0.25);
            outline: 0;
        }

        .badge {
            display: inline-block;
            padding: 8px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            vertical-align: baseline;
            border-radius: 8px;
        }

        .bg-secondary {
            background: var(--main-color) !important;
            color: white;
        }

        .bg-info {
            background: var(--accent-color) !important;
            color: var(--text-dark);
        }

        /* Расширенные анимации */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Новые анимации */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shine {
            0% { background-position: -100% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes rotateIn {
            from { transform: rotate(-5deg) scale(0.9); opacity: 0; }
            to { transform: rotate(0) scale(1); opacity: 1; }
        }

        /* Применение новых анимаций */
        .navbar-brand {
            position: relative;
            overflow: hidden;
        }

        .navbar-brand:after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            background-size: 200% 100%;
            animation: shine 3s infinite;
        }

        .card-header {
            animation: rotateIn 0.8s ease-out;
        }

        .btn-primary:active {
            animation: pulse 0.3s ease-out;
        }

        /* Добавляем анимацию для списков */
        .list-group-item:nth-child(odd) {
            animation: slideUp 0.5s ease-out forwards;
            animation-delay: calc(0.1s * var(--i, 1));
        }

        .list-group-item:nth-child(even) {
            animation: slideUp 0.5s ease-out forwards;
            animation-delay: calc(0.1s * var(--i, 1) + 0.05s);
        }

        /* Медиа запросы адаптивности */
        @media (max-width: 600px) {
            .container {
                padding: 0 15px;
            }
            
            .navbar-brand {
                font-size: 1.2rem;
            }
            
            .card {
                margin: 0 0 15px 0;
            }

            .navbar {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
        }

        /* Стили для подсветки синтаксиса */
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-color);
            overflow-x: auto;
            animation: fadeIn 1s ease-out;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Цвета для подсветки синтаксиса */
        .token.comment { color: #6b8331; }
        .token.keyword { color: #a86615; }
        .token.string { color: #b5840d; }
        .token.number { color: #9c7a14; }
        .token.function { color: #b35d00; }
        .token.operator { color: #604800; }
        .token.punctuation { color: #604800; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="/">PublicPaste</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/create">New Paste</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Улучшеная функция подсветки синтаксиса
        function highlightSyntax(code, language) {
            // Базовые правила синтаксиса
            const rules = {
                'python': {
                    keywords: /\b(and|as|assert|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield)\b/g,
                    strings: /(['"])(?:(?!\1)[^\\]|\\.)*\1/g,
                    comments: /#.*$/gm,
                    numbers: /\b\d+(?:\.\d+)?\b/g,
                    functions: /\b\w+(?=\()/g,
                    decorators: /@\w+/g
                },
                'javascript': {
                    keywords: /\b(break|case|catch|class|const|continue|debugger|default|delete|do|else|export|extends|finally|for|function|if|import|in|instanceof|new|return|super|switch|this|throw|try|typeof|var|let|void|while|with|yield|async|await)\b/g,
                    strings: /(['"`])(?:(?!\1)[^\\]|\\.)*\1/g,
                    comments: /\/\/.*$|\/\*[\s\S]*?\*\//gm,
                    numbers: /\b\d+(?:\.\d+)?\b/g,
                    functions: /\b\w+(?=\()/g,
                    regex: /\/(?![\/\*])(?:\[(?:\\.|[^\]\\])*]|\\.|[^\/\\])+\/[gimuy]*/g
                }
            };

            if (rules[language]) {
                const rule = rules[language];
                code = code
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(rule.keywords, '<span class="token keyword">$&</span>')
                    .replace(rule.strings, '<span class="token string">$&</span>')
                    .replace(rule.comments, '<span class="token comment">$&</span>')
                    .replace(rule.numbers, '<span class="token number">$&</span>');
                
                if (rule.decorators) {
                    code = code.replace(rule.decorators, '<span class="token decorator">$&</span>');
                }
                
                if (rule.regex) {
                    code = code.replace(rule.regex, '<span class="token regex">$&</span>');
                }
                
                // Применяем функции в последнюю очередь, чтобы избежать конфликтов с ключевыми словами
                code = code.replace(rule.functions, '<span class="token function">$&</span>');
            }

            return code;
        }

        // Применяем подсветку синтаксиса к блокам кода
        document.addEventListener('DOMContentLoaded', function() {
            const codeBlocks = document.querySelectorAll('pre code');
            codeBlocks.forEach((block, index) => {
                const language = block.className.match(/language-(\w+)/);
                if (language) {
                    block.innerHTML = highlightSyntax(block.textContent, language[1]);
                }
                
                // Анимируем блоки кода
                block.parentElement.style.setProperty('--i', index + 1);
                block.parentElement.style.animationDelay = `${0.1 * (index + 1)}s`;
            });
            
            // Добавляем анимацию к элементам списка
            const listItems = document.querySelectorAll('.list-group-item');
            listItems.forEach((item, index) => {
                item.style.setProperty('--i', index + 1);
            });
            
            // Добавляем эффект пульсации к navbar при прокрутке
            window.addEventListener('scroll', function() {
                const navbar = document.querySelector('.navbar');
                if (window.scrollY > 50) {
                    navbar.style.animation = 'pulse 2s infinite';
                } else {
                    navbar.style.animation = '';
                }
            });
        });
    </script>
</body>
</html>
